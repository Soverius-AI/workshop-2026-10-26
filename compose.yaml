name: soverius-rag-lab
services:
  download-models:
    image: soverius/workshop-model-download:offline-v1
    build: {context: ., dockerfile: infrastructure/Dockerfile.download}
    init: true
    network_mode: bridge
    restart: "no"
    stop_grace_period: 2s
    volumes: ["./models:/models"]
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:559ac229adefe0f7e2d4e32f5222f26927b6bb8ba44b9db08e2544afebf41984
    init: true
    ports: ["127.0.0.1:${LLAMA_PORT:-8080}:8080"]
    environment: {LLAMA_CACHE: /models, LLAMA_ARG_OFFLINE: "1"}
    volumes: ["./models:/models", "./workshop/llama:/config:ro"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--models-preset", "/config/models.ini", "--models-max", "1", "--no-models-autoload"]
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: raglab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: local-workshop-admin
    ports: ["127.0.0.1:${POSTGRES_PORT:-5436}:5432"]
    volumes: ["rag-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d raglab"]
      interval: 3s
      timeout: 3s
      retries: 20
  explorer:
    image: soverius/rag-lab-explorer:local
    build: {context: ., dockerfile: apps/explorer/Dockerfile}
    ports: ["127.0.0.1:${EXPLORER_PORT:-4341}:4341"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: raglab
      ADMIN_PASSWORD: local-workshop-admin
      WORKSHOP_PASSWORD: workshop
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-local-workshop-rag}
      EMBED_BASE_URL: ${EMBED_DOCKER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBED_MODEL: ${EMBED_MODEL:-baai/bge-m3}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_SPACE_ID: ${EMBED_SPACE_ID:-baai-bge-m3-v1}
      DOCUMENT_PREFIX: ""
      QUERY_PREFIX: ""
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://llama:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-Gemma}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes: ["./workshop/corpus/reference-documents:/pdfs:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4341/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  incident-backend:
    image: soverius/incident-backend:offline-v1
    build: {context: ., dockerfile: apps/incident-system/Dockerfile, target: incident-backend}
    init: true
    environment:
      FACILITY_HOST: 0.0.0.0
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      FACILITY_CHAT_MODE: ${FACILITY_CHAT_MODE:-local}
      MASTRA_BASE_URL: http://mastra:4211
      RAG_BASE_URL: http://explorer:4341
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-local-workshop-rag}
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://llama:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-Gemma}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FACILITY_DB_PATH: /data/facility.sqlite
    ports: ["127.0.0.1:${FACILITY_PORT:-3101}:3101"]
    volumes:
      - incident-data:/data
      - ./workshop/exercises:/app/workshop/exercises:ro
      - exercise-deps:/app/workshop/exercises/node_modules
    depends_on:
      exercises: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  incident:
    image: soverius/incident:offline-v1
    build: {context: ., dockerfile: apps/incident-system/Dockerfile, target: incident}
    ports: ["127.0.0.1:${INCIDENT_PORT:-4300}:80"]
    depends_on:
      incident-backend: {condition: service_healthy}
  mastra:
    image: soverius/workshop-mastra:offline-v1
    build: {context: ., dockerfile: apps/incident-system/Dockerfile, target: mastra}
    init: true
    ports: ["127.0.0.1:${MASTRA_PORT:-4211}:4211"]
    environment:
      MASTRA_HOST: 0.0.0.0
      MASTRA_PORT: 4211
      MASTRA_TELEMETRY_DISABLED: "1"
      MASTRA_STORAGE_PATH: /data/mastra.sqlite
      FACILITY_BASE_URL: http://incident-backend:3101
      RAG_BASE_URL: http://explorer:4341
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-local-workshop-rag}
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://llama:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-Gemma}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/incident-system/agent/src:/app/apps/incident-system/agent/src
      - mastra-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4211/api/agents').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  exercises:
    image: soverius/workshop-exercises:offline-v1
    build: {context: ., dockerfile: infrastructure/Dockerfile.exercises}
    init: true
    depends_on: [llama]
    environment:
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://llama:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-Gemma}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBED_BASE_URL: ${EMBED_DOCKER_BASE_URL:-https://openrouter.ai/api/v1}
      EMBED_MODEL: ${EMBED_MODEL:-baai/bge-m3}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
    volumes:
      - .:/workspace
      - exercise-deps:/workspace/workshop/exercises/node_modules
  model-inspect:
    image: soverius/model-inspect:local
    build: {context: ./infrastructure, dockerfile: Dockerfile.inspect}
    command: ["--help"]
    attach: false
    working_dir: /workspace
    volumes: ["./models:/workspace/models:ro"]
volumes:
  rag-data:
    name: soverius-rag-lab_rag-data
  incident-data:
  mastra-data:
  exercise-deps:
networks:
  default:
    ipam:
      config:
        - subnet: ${RAG_LAB_SUBNET:-10.203.44.0/24}
